<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lantern Road</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%23e8a948'/></svg>" />
  </head>
  <body>
    <header class="top">
      <h1>Lantern Road</h1>
      <span id="journey" class="journey"></span>
      <div class="controls">
        <div class="speed" role="group" aria-label="Game speed">
          <button data-speed="0" title="Pause (Space)">Pause</button>
          <button data-speed="1" title="Normal speed (1)">1×</button>
          <button data-speed="2" title="2× (2)">2×</button>
          <button data-speed="4" title="4× (3)">4×</button>
          <button data-speed="8" title="8× (4)">8×</button>
          <button data-speed="16" title="16× (5)">16×</button>
        </div>
        <label class="toggle"><input type="checkbox" id="auto" /> Auto-choose</label>
      </div>
    </header>

    <main class="layout">
      <section class="scene panel">
        <p class="eyebrow" id="phase"></p>
        <h2 id="node-title"></h2>
        <p id="scene-text" class="scene-text"></p>
        <div class="bar travel" aria-label="Journey progress"><span id="travel-bar"></span></div>

        <div id="foe" class="foe" hidden>
          <div class="foe-head"><strong id="foe-name"></strong><span id="foe-hp-text"></span></div>
          <div class="bar foe-hp"><span id="foe-hp"></span></div>
        </div>

        <div id="choice" class="choice" hidden>
          <p id="prompt" class="prompt"></p>
          <div id="choices" class="choices"></div>
          <p id="auto-note" class="note"></p>
        </div>

        <ol id="log" class="log" aria-live="polite"></ol>
      </section>

      <aside class="side">
        <section class="panel hero">
          <h3>Wanderer <span id="level"></span></h3>
          <div class="stat-row"><span>HP</span><span id="hp-text"></span></div>
          <div class="bar hp"><span id="hp-bar"></span></div>
          <div class="stat-row"><span>XP</span><span id="xp-text"></span></div>
          <div class="bar xp"><span id="xp-bar"></span></div>
          <dl class="stats">
            <div><dt>ATK</dt><dd id="atk"></dd></div>
            <div><dt>DEF</dt><dd id="def"></dd></div>
            <div><dt>Gold</dt><dd id="gold"></dd></div>
            <div><dt>Potions</dt><dd id="potions"></dd></div>
          </dl>
        </section>

        <section class="panel shop">
          <h3>Camp supplies</h3>
          <div id="shop" class="shop-list"></div>
        </section>

        <section class="panel record">
          <h3>Record</h3>
          <p id="record"></p>
          <button id="reset" class="link">Start over</button>
        </section>
      </aside>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
